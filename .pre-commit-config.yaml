repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-merge-conflict
      # Diffs are byte-exact inputs to `git apply`; whitespace normalisation
      # silently breaks context matching.
      - id: end-of-file-fixer
        exclude: '\.patch$'
      - id: mixed-line-ending
        exclude: '\.patch$'
      - id: trailing-whitespace
        exclude: '\.patch$'

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
      - id: clang-format
        types_or: [file]
        files: '\.(mu|muh)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff-check
      - id: ruff-format
        types_or: [python, pyi]
