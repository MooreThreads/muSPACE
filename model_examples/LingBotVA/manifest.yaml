name: LingBotVA
repository: https://github.com/Robbyant/lingbot-va.git
reference_branch: main
reference_commit: 58c2ae5bac46bd8114065bea9d7d256eb67c16c3
default_checkout: LingBotVA
integration:
  maintains_fork: false
  training_entrypoint: model_examples/LingBotVA/scripts/train_posttrain_smoke.sh
  validation_entrypoint: model_examples/LingBotVA/scripts/validate_fixture.sh
