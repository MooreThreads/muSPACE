# The recipe patches provide the MUSA device layer, the attention paths, the
# FlexAttention BlockMask compatibility workaround and the fused RoPE and FSDP
# tuning paths; muSPACE itself contributes no native operator to this model, so
# no muSPACE-specific kernel is dispatched.
patch_marker: .mu_space_lingbotva.json
patches:
