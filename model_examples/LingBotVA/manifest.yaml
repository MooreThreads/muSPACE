    sha256: 06a9a72e8c2a09265b19e0b117e60a83cc4bdcb2303d29ad3a674d332bb3411f
    scope: musa_device_runtime_and_distributed_backend
  - path: patches/lingbot-va-02-musa-attention-flex.patch
    sha256: 7e94d62ff150df5032aaa53657053bfd69ae195afe8d64940345416c991033c5
    scope: musa_attention_paths_and_flex_blockmask
  - path: patches/lingbot-va-03-training-entrypoint.patch
    sha256: e51fa1a3c98355ef1d4d8caa129e163cb66b55ae2f2a86e5aeeca1ddeeec30d4
    scope: reproducible_training_entrypoint
  - path: patches/lingbot-va-04-rope-fusion-and-fsdp-tuning.patch
