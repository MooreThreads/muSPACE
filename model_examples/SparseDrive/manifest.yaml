name: SparseDrive
repository: https://github.com/swc-17/SparseDrive.git
reference_branch: main
reference_commit: fbadea693cbef3f3daea7705e521c0dd3321605c
default_checkout: SparseDrive
integration:
  maintains_fork: false
  operator: deformable_aggregation
  runtime_patcher: mu_space.patcher.sparsedrive_patcher
  strict_backend: musa
patch_marker: .mu_space_sparsedrive.json
# The recipe ships no checkout patches. SparseDrive is integrated at runtime by
# mu_space.patcher.sparsedrive_patcher, which rebinds the upstream
# deformable_aggregation binding without editing the checkout. The pinned commit's
# baseline kernels are verified token-identical to the operator lineage recorded in
# docs/provenance.md. The patcher also tolerates the upstream
# deformable_aggregation_ext CUDA extension being absent, because this recipe never
# builds it.
patches: []
