# Install the platform-specific PyTorch and torch_musa build separately, then this stack.
#
# Derived from the pinned upstream requirement.txt with the compatibility overrides the
# OpenMMLab 1.0.0rc4 recipes in this repository share:
#
#   * Unmodified mmdet3d 1.0.0rc4 rejects mmcv 1.7.1+, so the pure-Python mmcv 1.7.0
#     replaces mmcv_full 1.7.1. The compiled mmcv extensions are not needed: muSPACE
#     replaces the operators that used them.
#   * numpy, pandas, scikit-learn, and yapf are moved to releases that still publish
#     Python 3.10 wheels; the upstream pins predate them.
#   * shapely is pinned below 2.0, which the upstream map vectorisation predates.
#   * einops is imported by the upstream model package but is absent from
#     requirement.txt, so it is listed without a pin.
#   * flash-attn is deliberately not listed. It is CUDA-only, and the pinned model
#     package imports it unconditionally, so the target platform has to provide an
#     importable build before a training run can start.
