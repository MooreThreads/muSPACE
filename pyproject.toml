[project]
name = "mu-space"
description = "MUSA Spatial and Physical AI Compute Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<4"
authors = [{ name = "muSPACE Contributors" }]
keywords = ["musa", "autonomous-driving", "spatial-ai", "pytorch", "operators"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
    "apache-tvm-ffi>=0.1.9.post3",
    "click>=8",
    "packaging>=24",
    "pyyaml>=6",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=2.21"]

[project.urls]
Homepage = "https://github.com/MooreThreads/muSPACE"
Repository = "https://github.com/MooreThreads/muSPACE"
Documentation = "https://github.com/MooreThreads/muSPACE/tree/main/docs"

[project.scripts]
mu-space = "mu_space.__main__:cli"

[build-system]
requires = ["setuptools>=77", "wheel", "ninja", "apache-tvm-ffi>=0.1.9.post3"]
build-backend = "build_backend"
backend-path = ["."]

[tool.setuptools.dynamic]
version = { attr = "mu_space._version.__version__" }

[tool.setuptools]
include-package-data = true
py-modules = ["build_backend", "build_utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mu_space*"]

[tool.setuptools.package-data]
"mu_space" = ["_version.py", "native/*.so"]

[tool.setuptools.data-files]
"share/mu-space/model_examples/BEVFusion" = [
    "model_examples/BEVFusion/manifest.yaml",
    "model_examples/BEVFusion/requirements.lock",
]
